# vroom-express configuration used by the FMS routing stack (Docker Compose and Helm).
cliArgs:
  geometry: true # allow route geometry (requests send options.g)
  planmode: false
  threads: 4
  explore: 5
  limit: '1mb'
  logdir: '/..'
  logsize: '100M'
  maxlocations: 1000
  maxvehicles: 200
  override: true
  path: ''
  port: 3000
  router: 'osrm'
  timeout: 300000
  baseurl: '/'
routingServers:
  osrm:
    car:
      host: 'OSRM_HOST'
      port: '5000'
