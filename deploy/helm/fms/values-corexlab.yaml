# Test deployment on the CorexLab Talos cluster (Portainer environment talos-corexlab-portainer).
# Database: fms-test-postgres release "fms-db" in the same namespace (values-corexlab.yaml of that chart). Files: CorexLab SeaweedFS.
# Ingress is configured manually by the cluster admin (Traefik) → service <release>-fms-web:80.
# Images are public on GHCR, so no pull secret is needed.
image:
  # Deploy an immutable commit tag: --set image.api.tag=<sha> --set image.web.tag=<sha>
  api: { repository: ghcr.io/redbeegroup/fleet-management/api, tag: "8f161a3bc9d9e974800a5c5a4488a120e60ca928", pullPolicy: IfNotPresent }
  web: { repository: ghcr.io/redbeegroup/fleet-management/web, tag: "8f161a3bc9d9e974800a5c5a4488a120e60ca928", pullPolicy: IfNotPresent }
database:
  externalService: { enabled: false }
secrets:
  existingSecret: fms-secrets
config:
  SWAGGER_ENABLED: "true"
  CORS_ORIGINS: https://fms.corexlab.net
  APP_URL: https://fms.corexlab.net
  TELEMATICS_PROVIDER: mock          # until the Watch Tower API is connected
  S3_ENDPOINT: https://s3.corexlab.net
  S3_BUCKET: cannopy-fms
  PUSH_ENABLED: "false"
api:
  replicas: 2
  autoscaling: { enabled: false }
  pdb: { minAvailable: 1 }
ingest: { replicas: 1 }
web:
  replicas: 2
redis:
  internal: { enabled: true }
migrations:
  enabled: true
  seed: true                         # demo data for testing
ingress: { enabled: false }
networkPolicy:
  enabled: true
  ingressFrom:
    - namespaceSelector:
        matchLabels: { kubernetes.io/metadata.name: traefik }
