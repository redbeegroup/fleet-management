# Test deployment on the CorexLab Talos cluster (Portainer environment talos-corexlab-portainer).
# Database: fms-test-postgres release "fms-db" in the same namespace (values-corexlab.yaml of that chart). Files: CorexLab SeaweedFS.
# Ingress is configured manually by the cluster admin (Traefik) → service <release>-fms-web:80.
# Images are public on GHCR, so no pull secret is needed.
image:
  # Deploy an immutable commit tag: --set image.api.tag=<sha> --set image.web.tag=<sha>
  api: { repository: ghcr.io/redbeegroup/fleet-management/api, tag: "3f6a3e5657ac412425b392512ab3dd7a9b3e712e", pullPolicy: IfNotPresent }
  web: { repository: ghcr.io/redbeegroup/fleet-management/web, tag: "3f6a3e5657ac412425b392512ab3dd7a9b3e712e", pullPolicy: IfNotPresent }
database:
  externalService: { enabled: false }
secrets:
  existingSecret: fms-secrets
config:
  SWAGGER_ENABLED: "true"
  CORS_ORIGINS: https://fms.corexlab.net
  APP_URL: https://fms.corexlab.net
  TELEMATICS_PROVIDER: mock          # until the Watch Tower API is connected
  S3_ENDPOINT: https://s3.corexlab.net
  S3_BUCKET: cannopy-fms
  PUSH_ENABLED: "false"
api:
  replicas: 2
  autoscaling: { enabled: false }
  pdb: { minAvailable: 1 }
ingest: { replicas: 1 }
web:
  replicas: 2
redis:
  # Google's Docker Hub mirror: the cluster's pulls from docker.io time out intermittently.
  internal: { enabled: true, image: mirror.gcr.io/library/redis:7-alpine }
migrations:
  enabled: true
  seed: true                         # demo data for testing
  activeDeadlineSeconds: 1800        # image pulls from GHCR can take >10 min on this cluster
ingress: { enabled: false }
networkPolicy:
  enabled: true
  ingressFrom:
    - namespaceSelector:
        matchLabels: { kubernetes.io/metadata.name: traefik }

# wo4's pod network is broken (flannel: "cni0 already has an IP address different
# from 10.244.6.1/24") and wo1 cannot pull from ghcr.io (pulls hang). Keep FMS off
# both until they are repaired.
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - { key: kubernetes.io/hostname, operator: NotIn, values: [wo1, wo4] }
            - { key: node-role.kubernetes.io/control-plane, operator: DoesNotExist }
