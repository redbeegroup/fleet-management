{{- if .Values.migrations.enabled }}
{{- /*
  Runs before every install/upgrade. Uses DATABASE_MIGRATION_URL (DDL role);
  application pods only get DML rights through DATABASE_URL.
  The hook needs config/secret, so those must exist beforehand: the ConfigMap is
  also emitted as a hook below; the Secret must be pre-created (existingSecret).
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "fms.fullname" . }}-migrate-config
  labels:
    {{- include "fms.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
data:
  {{- range $k, $v := .Values.config }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
  SEED: {{ .Values.migrations.seed | quote }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "fms.fullname" . }}-migrate
  labels:
    {{- include "fms.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migrations.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "fms.selectorLabels" (dict "root" . "component" "migrate") | nindent 8 }}
    spec:
      restartPolicy: Never
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "fms.image" (dict "root" . "which" "api") }}
          imagePullPolicy: {{ .Values.image.api.pullPolicy }}
          args: ["scripts/migrate.js"]
          envFrom:
            - configMapRef:
                name: {{ include "fms.fullname" . }}-migrate-config
          env:
            # Prisma needs DATABASE_URL to load the schema; migrations use directUrl.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: {{ include "fms.secretName" . }}, key: DATABASE_MIGRATION_URL }
            - name: DATABASE_MIGRATION_URL
              valueFrom:
                secretKeyRef: { name: {{ include "fms.secretName" . }}, key: DATABASE_MIGRATION_URL }
            {{- if .Values.migrations.seed }}
            # Demo seed in a NODE_ENV=production image must be allowed explicitly.
            - name: SEED_ALLOW
              value: "true"
            - name: SEED_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ include "fms.secretName" . }}, key: SEED_ADMIN_PASSWORD, optional: true }
            {{- end }}
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
{{- end }}
