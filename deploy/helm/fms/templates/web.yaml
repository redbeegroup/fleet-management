apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fms.fullname" . }}-web
  labels:
    {{- include "fms.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  {{- if not .Values.web.autoscaling.enabled }}
  replicas: {{ .Values.web.replicas }}
  {{- end }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      {{- include "fms.selectorLabels" (dict "root" . "component" "web") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fms.selectorLabels" (dict "root" . "component" "web") | nindent 8 }}
    spec:
      {{- include "fms.podSecurity" . | nindent 6 }}
      containers:
        - name: web
          image: {{ include "fms.image" (dict "root" . "which" "web") }}
          imagePullPolicy: {{ .Values.image.web.pullPolicy }}
          env:
            - name: API_UPSTREAM
              value: http://{{ include "fms.fullname" . }}-api:{{ .Values.api.port }}
          ports:
            - name: http
              containerPort: {{ .Values.web.port }}
          livenessProbe:
            httpGet: { path: /healthz, port: http }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: nginx-conf, mountPath: /etc/nginx/conf.d }
      volumes:
        - { name: tmp, emptyDir: {} }
        - { name: nginx-conf, emptyDir: {} }
