image: postgis/postgis:16-3.4
storageClass: ""        # e.g. synology-iscsi
size: 10Gi
database: fms
# Passwords: set at install (--set). The owner role runs migrations; fms_app is the RLS-bound app role.
ownerUser: fms_owner
ownerPassword: ""
appPassword: ""
resources:
  requests: { cpu: 100m, memory: 256Mi }
  limits: { memory: 1Gi }
# Pod scheduling, e.g. only nodes that can mount the volume type (Talos iscsi-tools extension):
#   affinity: { nodeAffinity: { requiredDuringSchedulingIgnoredDuringExecution: { nodeSelectorTerms: [
#     { matchExpressions: [ { key: extensions.talos.dev/iscsi-tools, operator: Exists } ] } ] } } }
affinity: {}
nodeSelector: {}
