# FMS test environment: the whole stack, including PostgreSQL, on Docker.
#   cp deploy/docker/.env.example deploy/docker/.env
#   docker compose -f deploy/docker/docker-compose.yml --env-file deploy/docker/.env up -d --build
# Web console: http://localhost:8080   API docs: http://localhost:8080/api/docs

x-api-env: &api-env
  NODE_ENV: production
  DATABASE_URL: postgresql://fms_app:${FMS_APP_PASSWORD}@postgres:5432/${POSTGRES_DB}
  DATABASE_MIGRATION_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  REDIS_URL: redis://redis:6379
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
  JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
  JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:-14}
  CORS_ORIGINS: http://localhost:${WEB_PORT:-8080}
  SWAGGER_ENABLED: "true"
  TELEMATICS_PROVIDER: ${TELEMATICS_PROVIDER:-mock}
  WATCHTOWER_BASE_URL: ${WATCHTOWER_BASE_URL:-}
  WATCHTOWER_API_KEY: ${WATCHTOWER_API_KEY:-}
  WATCHTOWER_POLL_SECONDS: ${WATCHTOWER_POLL_SECONDS:-30}
  # Files: S3 API (SeaweedFS in this stack). STORAGE_DRIVER=local + the files volume is a fallback.
  STORAGE_DRIVER: ${STORAGE_DRIVER:-s3}
  STORAGE_LOCAL_DIR: /app/.data/files
  S3_ENDPOINT: ${S3_ENDPOINT:-http://seaweedfs:8333}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_BUCKET: ${S3_BUCKET:-fms}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY}
  S3_FORCE_PATH_STYLE: "true"
  FILE_MAX_MB: ${FILE_MAX_MB:-20}
  SMTP_URL: smtp://mailpit:1025
  MAIL_FROM: ${MAIL_FROM:-FMS <no-reply@fms.local>}
  APP_URL: http://localhost:${WEB_PORT:-8080}
  LOG_FORMAT: ${LOG_FORMAT:-text}
  PUSH_ENABLED: ${PUSH_ENABLED:-false}

x-api-image: &api-image
  image: fms/api:${IMAGE_TAG:-local}
  restart: unless-stopped

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      FMS_APP_PASSWORD: ${FMS_APP_PASSWORD}
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # S3-compatible object storage for documents, photos and receipts.
  seaweedfs:
    image: chrislusf/seaweedfs:3.80
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        printf '{"identities":[{"name":"fms","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}'
        "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /tmp/s3.json &&
        exec weed server -dir=/data -s3 -s3.port=8333 -s3.config=/tmp/s3.json -master.volumeSizeLimitMB=1024 -volume.max=0
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    volumes:
      - s3data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "127.0.0.1:8025:8025"
    restart: unless-stopped

  # One-shot: apply migrations (as DB owner) and optionally seed demo data.
  migrate:
    <<: *api-image
    build:
      context: ../..
      dockerfile: deploy/docker/api.Dockerfile
    environment:
      <<: *api-env
      # Seeding runs as the owner role.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      NODE_ENV: development
      SEED: ${SEED:-true}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@fms.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-ChangeMe123!}
    command: ["scripts/migrate.js"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *api-image
    environment:
      <<: *api-env
      MODE: api
    volumes:
      - files:/app/.data/files
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy

  worker:
    <<: *api-image
    environment:
      <<: *api-env
      MODE: worker
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  ingest:
    <<: *api-image
    environment:
      <<: *api-env
      MODE: ingest
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    image: fms/web:${IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: deploy/docker/web.Dockerfile
    environment:
      API_UPSTREAM: http://api:3000
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  files:
  s3data:
  redisdata:
